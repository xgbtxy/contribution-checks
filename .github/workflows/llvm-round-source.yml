name: LLVM MLIR round source red-green validation

on:
  push:
    branches: [validation/llvm-round-235156]
    paths:
      - .github/workflows/llvm-round-source.yml
      - run_llvm_round_source.py
      - llvm-round-driver/**
      - llvm-round-cases.json
      - patches/llvm-round/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-round-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-llvm-round
      CCACHE_BASEDIR: ${{ github.workspace }}/llvm-src
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: llvm/llvm-project
          ref: cc17c75d47aff09d841471b9309750ecaabe3122
          path: llvm-src
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            llvm
            mlir
            cmake
            third-party
            libc
      - name: Install official LLVM24 lowering tools and source build prerequisites
        run: |
          set -euo pipefail
          mkdir -p artifacts/llvm-round-source
          curl --fail --location --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-key.asc
          fingerprint="$(gpg --show-keys --with-colons /tmp/llvm-key.asc | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          sudo install -m 0644 /tmp/llvm-key.asc /usr/share/keyrings/llvm-round.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm-round.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble main' | sudo tee /etc/apt/sources.list.d/llvm-round.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache llvm-24 llvm-24-tools mlir-24-tools clang-format-24
          dpkg-query -W -f='${binary:Package}=${Version}\n' llvm-24 llvm-24-tools mlir-24-tools clang-format-24 > artifacts/llvm-round-source/packages.txt
          uname -a > artifacts/llvm-round-source/host.txt
          lscpu >> artifacts/llvm-round-source/host.txt
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.CCACHE_DIR }}
          key: llvm-round-cc17-x64-assert-v1-${{ github.run_id }}
          restore-keys: llvm-round-cc17-x64-assert-v1-
      - name: Build actual source MathTransforms and validate original then candidate
        run: python3 run_llvm_round_source.py
      - name: Record compiler cache statistics
        if: always()
        run: ccache --show-stats > artifacts/llvm-round-source/compiler-cache.txt
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: llvm-round-cc17-x64-assert-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: llvm-round-source-${{ github.run_id }}
          path: artifacts/llvm-round-source/
          if-no-files-found: error
          retention-days: 14
