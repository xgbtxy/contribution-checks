name: RocksDB issue 15439 validation

on:
  workflow_dispatch:
    inputs:
      candidate_patch:
        description: Optional patch path inside this helper checkout; omit for the upstream baseline.
        required: false
        default: ""
        type: string
      run_focused_gtest:
        description: After applying a candidate patch, build and run the focused DBBasicTest filter.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout validation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create small artifact workspace
        run: mkdir -p artifacts/logs artifacts/fixtures artifacts/old-sst

      - name: Checkout RocksDB at the reviewed upstream main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: meta/rocksdb
          ref: 87d442749a6a9f0fe5b9f07de7346466f8dd5acf
          path: rocksdb
          fetch-depth: 1
          persist-credentials: false

      - name: Install Snappy development dependency if missing
        run: |
          set -euo pipefail
          if ! dpkg-query -W -f='${Status}' libsnappy-dev 2>/dev/null | grep -q 'install ok installed'; then
            sudo apt-get update -qq >/tmp/rocksdb-snappy-install.log 2>&1
            sudo apt-get install -y libsnappy-dev >>/tmp/rocksdb-snappy-install.log 2>&1
            tail -n 20 /tmp/rocksdb-snappy-install.log > artifacts/logs/snappy-install-tail.log
          fi
          if command -v pkg-config >/dev/null 2>&1 && pkg-config --exists snappy; then
            pkg-config --modversion snappy > artifacts/logs/snappy-version.log
          else
            dpkg-query -W -f='${Package} ${Version}\n' libsnappy-dev > artifacts/logs/snappy-version.log
          fi

      - name: Run the attributed baseline and optional candidate checks
        env:
          CANDIDATE_PATCH: ${{ inputs.candidate_patch }}
          RUN_FOCUSED_GTEST: ${{ inputs.run_focused_gtest }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$CANDIDATE_PATCH" ]]; then
            args+=(--candidate-patch "$CANDIDATE_PATCH")
          fi
          if [[ "$RUN_FOCUSED_GTEST" == "true" ]]; then
            args+=(--run-focused-gtest)
          fi
          python3 run_rocksdb_prefix.py --source rocksdb --artifacts artifacts "${args[@]}"

      - name: Upload compact logs, raw block fixtures, and old SSTs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rocksdb-prefix-15439-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
